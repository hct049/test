<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spreadsheet DB 테스트</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f4f6f9;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 16px;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
      padding: 32px;
      width: 100%;
      max-width: 520px;
      height: fit-content;
    }
    h1 { font-size: 1.4rem; margin-bottom: 6px; color: #1a1a2e; }
    p.desc { font-size: 0.85rem; color: #666; margin-bottom: 24px; }

    .section-title {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #888;
      margin: 24px 0 10px;
    }

    label { display: block; font-size: 0.85rem; color: #444; margin-bottom: 4px; }
    input, textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 0.95rem;
      margin-bottom: 12px;
      outline: none;
      transition: border 0.2s;
    }
    input:focus, textarea:focus { border-color: #4f46e5; }
    textarea { resize: vertical; min-height: 72px; }

    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 4px;
    }
    .btn-grid.single { grid-template-columns: 1fr; }

    button {
      padding: 11px 12px;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: filter 0.15s;
      color: #fff;
      font-weight: 500;
    }
    button:hover   { filter: brightness(0.9); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-blue   { background: #4f46e5; }
    .btn-cyan   { background: #0891b2; }
    .btn-green  { background: #059669; }
    .btn-orange { background: #d97706; }
    .btn-red    { background: #dc2626; }

    .config-note {
      background: #fffbeb;
      border: 1px solid #fcd34d;
      border-radius: 8px;
      padding: 12px;
      font-size: 0.8rem;
      color: #92400e;
      margin-bottom: 20px;
    }
    .config-note code {
      background: #fef3c7;
      padding: 1px 4px;
      border-radius: 4px;
      font-family: monospace;
    }

    #result {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 0.88rem;
      display: none;
    }
    #result.success { background: #ecfdf5; color: #065f46; border: 1px solid #6ee7b7; }
    #result.error   { background: #fef2f2; color: #991b1b; border: 1px solid #fca5a5; }

    #rawResult {
      display: none;
      margin-top: 10px;
      padding: 12px;
      background: #1e1e2e;
      color: #cdd6f4;
      border-radius: 8px;
      font-size: 0.78rem;
      font-family: monospace;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }

    hr { border: none; border-top: 1px solid #f0f0f0; margin: 20px 0 0; }
  </style>
</head>
<body>
  <div class="card">
    <h1>📋 Spreadsheet DB 테스트</h1>
    <p class="desc">Apps Script 라이브러리 연동 테스트 페이지입니다.</p>

    <div class="config-note" id="configNote">
      ⚠️ Apps Script URL을 설정하세요.<br/>
      <code>GAS_URL</code> 변수에 직접 입력하거나,
      URL 파라미터 <code>?gasUrl=YOUR_URL</code> 로 전달하세요.
    </div>

    <!-- 연결 테스트 -->
    <div class="section-title">연결 테스트</div>
    <div class="btn-grid single">
      <button class="btn-cyan" onclick="callAction('ping')">🔗 라이브러리 연결 확인 (ping)</button>
    </div>

    <!-- 데이터 입력 -->
    <div class="section-title">데이터 입력</div>
    <label for="name">이름</label>
    <input type="text" id="name" placeholder="홍길동" />
    <label for="email">이메일</label>
    <input type="email" id="email" placeholder="example@email.com" />
    <label for="message">메시지</label>
    <textarea id="message" placeholder="내용을 입력하세요"></textarea>
    <div class="btn-grid single">
      <button class="btn-blue" onclick="submitData()">💾 스프레드시트에 저장</button>
    </div>

    <!-- 기능 버튼 -->
    <div class="section-title">기능 테스트</div>
    <div class="btn-grid">
      <button class="btn-green"  onclick="callAction('appendRandomRow')">🎲 랜덤 10글자 입력</button>
      <button class="btn-orange" onclick="callAction('deleteLastRow')">🗑 마지막 행 삭제</button>
    </div>
    <div class="btn-grid single" style="margin-top:8px;">
      <button class="btn-red" onclick="confirmClear()">⚠️ 전체 데이터 삭제</button>
    </div>

    <div id="result"></div>
    <pre id="rawResult"></pre>
  </div>

  <script>
    const GAS_URL = '';

    function getGasUrl() {
      return new URLSearchParams(window.location.search).get('gasUrl') || GAS_URL;
    }

    window.addEventListener('DOMContentLoaded', () => {
      if (getGasUrl()) document.getElementById('configNote').style.display = 'none';
    });

    // 모든 버튼의 공통 요청 함수 (GET)
    async function callAction(action) {
      const gasUrl = getGasUrl();
      if (!gasUrl) { showResult('error', 'Apps Script URL이 설정되지 않았습니다.'); return; }

      setAllButtons(true);
      try {
        const res  = await fetch(gasUrl + '?action=' + action);
        const text = await res.text();
        handleResponse(text);
      } catch (err) {
        showResult('error', '요청 실패: ' + err.message);
        showRaw(err.toString());
      } finally {
        setAllButtons(false);
      }
    }

    // 폼 데이터 저장 (POST)
    async function submitData() {
      const gasUrl = getGasUrl();
      if (!gasUrl) { showResult('error', 'Apps Script URL이 설정되지 않았습니다.'); return; }

      const name    = document.getElementById('name').value.trim();
      const email   = document.getElementById('email').value.trim();
      if (!name || !email) { showResult('error', '이름과 이메일은 필수 항목입니다.'); return; }

      setAllButtons(true);
      const fd = new FormData();
      fd.append('action',    'appendRow');
      fd.append('name',      name);
      fd.append('email',     email);
      fd.append('message',   document.getElementById('message').value.trim());
      fd.append('timestamp', new Date().toISOString());

      try {
        const res  = await fetch(gasUrl, { method: 'POST', body: fd });
        const text = await res.text();
        handleResponse(text);
      } catch (err) {
        showResult('success', '✅ 요청 전송 완료 (CORS 제한으로 응답 확인 불가)');
      } finally {
        setAllButtons(false);
      }
    }

    function confirmClear() {
      if (confirm('헤더를 제외한 모든 데이터를 삭제합니다. 계속하시겠습니까?')) {
        callAction('clearAllData');
      }
    }

    function handleResponse(text) {
      let data;
      try { data = JSON.parse(text); } catch { data = { status: 'ok', message: text }; }
      const pretty = JSON.stringify(data, null, 2);
      showRaw(pretty);
      if (data.status === 'error') {
        showResult('error', '오류: ' + (data.message || '알 수 없는 오류'));
      } else {
        showResult('success', '✅ ' + (data.message || '완료'));
      }
    }

    function setAllButtons(disabled) {
      document.querySelectorAll('button').forEach(b => b.disabled = disabled);
    }

    function showResult(type, msg) {
      const el = document.getElementById('result');
      el.className = type;
      el.textContent = msg;
      el.style.display = 'block';
    }

    function showRaw(text) {
      const el = document.getElementById('rawResult');
      el.textContent = text;
      el.style.display = 'block';
    }
  </script>
</body>
</html>
