<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spreadsheet DB 테스트</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 40px 16px;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
      padding: 32px;
      width: 100%;
      max-width: 480px;
    }
    h1 { font-size: 1.4rem; margin-bottom: 8px; color: #1a1a2e; }
    p.desc { font-size: 0.85rem; color: #666; margin-bottom: 24px; }
    label { display: block; font-size: 0.85rem; color: #444; margin-bottom: 4px; }
    input, textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 0.95rem;
      margin-bottom: 16px;
      outline: none;
      transition: border 0.2s;
    }
    input:focus, textarea:focus { border-color: #4f46e5; }
    textarea { resize: vertical; min-height: 80px; }
    button {
      width: 100%;
      padding: 12px;
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #4338ca; }
    button:disabled { background: #a5b4fc; cursor: not-allowed; }
    #result {
      margin-top: 20px;
      padding: 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      display: none;
    }
    #result.success { background: #ecfdf5; color: #065f46; border: 1px solid #6ee7b7; }
    #result.error   { background: #fef2f2; color: #991b1b; border: 1px solid #fca5a5; }
    .config-note {
      background: #fffbeb;
      border: 1px solid #fcd34d;
      border-radius: 8px;
      padding: 12px;
      font-size: 0.8rem;
      color: #92400e;
      margin-bottom: 20px;
    }
    .config-note code {
      background: #fef3c7;
      padding: 1px 4px;
      border-radius: 4px;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>📋 Spreadsheet DB 테스트</h1>
    <p class="desc">스프레드시트에 데이터를 직접 저장하는 기능을 테스트합니다.</p>

    <div class="config-note" id="configNote">
      ⚠️ Apps Script URL을 설정하세요.<br/>
      아래 <code>GAS_URL</code> 변수에 배포된 웹앱 URL을 입력하거나,<br/>
      URL 파라미터 <code>?gasUrl=YOUR_URL</code> 로 지정할 수 있습니다.
    </div>

    <label for="name">이름</label>
    <input type="text" id="name" placeholder="홍길동" />

    <label for="email">이메일</label>
    <input type="email" id="email" placeholder="example@email.com" />

    <label for="message">메시지</label>
    <textarea id="message" placeholder="테스트 내용을 입력하세요"></textarea>

    <button id="submitBtn" onclick="submitData()">스프레드시트에 저장</button>

    <div id="result"></div>
  </div>

  <script>
    // ── 설정 ──────────────────────────────────────────────
    // 배포한 Apps Script 웹앱 URL을 여기에 입력하거나
    // URL 파라미터 ?gasUrl=... 로 전달하세요.
    const GAS_URL = '';
    // ─────────────────────────────────────────────────────

    function getGasUrl() {
      const params = new URLSearchParams(window.location.search);
      return params.get('gasUrl') || GAS_URL;
    }

    window.addEventListener('DOMContentLoaded', () => {
      const url = getGasUrl();
      if (url) {
        document.getElementById('configNote').style.display = 'none';
      }
    });

    async function submitData() {
      const gasUrl = getGasUrl();
      if (!gasUrl) {
        showResult('error', 'Apps Script URL이 설정되지 않았습니다. GAS_URL을 입력하거나 ?gasUrl=... 파라미터를 사용하세요.');
        return;
      }

      const name    = document.getElementById('name').value.trim();
      const email   = document.getElementById('email').value.trim();
      const message = document.getElementById('message').value.trim();

      if (!name || !email) {
        showResult('error', '이름과 이메일은 필수 항목입니다.');
        return;
      }

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = '저장 중...';

      const payload = { name, email, message, timestamp: new Date().toISOString() };

      try {
        // Apps Script 웹앱은 CORS preflight를 지원하지 않으므로
        // no-cors 모드로 POST 후, GET으로 결과를 확인하는 방식 사용
        const formData = new FormData();
        Object.entries(payload).forEach(([k, v]) => formData.append(k, v));

        const res = await fetch(gasUrl, {
          method: 'POST',
          body: formData,
        });

        const text = await res.text();
        let data;
        try { data = JSON.parse(text); } catch { data = { status: 'ok', message: text }; }

        if (data.status === 'error') {
          showResult('error', '오류: ' + (data.message || '알 수 없는 오류'));
        } else {
          showResult('success', '✅ 저장 완료! 스프레드시트를 확인하세요.');
        }
      } catch (err) {
        // no-cors로 인해 응답을 못 읽는 경우도 실제로는 저장됐을 수 있음
        showResult('success', '✅ 요청을 전송했습니다. 스프레드시트를 확인하세요.\n(CORS 제한으로 응답 확인 불가)');
      } finally {
        btn.disabled = false;
        btn.textContent = '스프레드시트에 저장';
      }
    }

    function showResult(type, msg) {
      const el = document.getElementById('result');
      el.className = type;
      el.textContent = msg;
      el.style.display = 'block';
    }
  </script>
</body>
</html>
